name: Contribution city
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_city.py, .github/workflows/contribution-city.yml]
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_city.py
      - name: Commit generated asset
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp assets/contribution-city.svg /tmp/contribution-city.svg
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p assets
            cp /tmp/contribution-city.svg assets/contribution-city.svg
            git add assets/contribution-city.svg
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update contribution city"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
