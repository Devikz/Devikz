name: Contribution city
on:
  workflow_dispatch:
  push:
    branches: [profile/obsidian-emerald]
    paths: [scripts/generate_city.py, .github/workflows/contribution-city.yml]
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Generate city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_city.py
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg
          git diff --cached --quiet || git commit -m "Update contribution city"
          git push
